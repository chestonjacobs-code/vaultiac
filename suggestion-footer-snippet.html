<!-- ============================================
     SUGGESTION FOOTER — paste before <script src="/js/api.js"></script>
</body>
     ============================================ -->

<!-- FOOTER TRIGGER -->
<div class="suggest-footer">
  <button class="suggest-trigger" id="suggestTrigger">
    <span class="st-icon">💡</span>
    <span class="st-text">Got an idea? Tell us</span>
    <span class="st-arrow">›</span>
  </button>
</div>

<!-- OVERLAY -->
<div class="suggest-overlay" id="suggestOverlay"></div>

<!-- SLIDE-UP PANEL -->
<div class="suggest-panel" id="suggestPanel">
  <div class="sp-handle"></div>
  <div class="sp-head">
    <div>
      <div class="sp-kick">Feature Request</div>
      <div class="sp-title">Got an idea?</div>
    </div>
    <button class="sp-close" id="suggestClose">✕</button>
  </div>
  <div class="sp-body">
    <div class="sp-sub">Quick suggestions go straight to the team. Keep it short — one idea at a time.</div>
    <textarea class="sp-input" id="suggestInput" placeholder="e.g. Add a daily streak reminder notification…" maxlength="280"></textarea>
    <div class="sp-count"><span id="charCount">0</span>/280</div>
    <button class="sp-submit" id="suggestSubmit">Send Idea</button>
    <div class="sp-sent" id="suggestSent">✓ Got it — thanks for the idea.</div>
  </div>
</div>

<style>
.suggest-footer{width:100%;max-width:560px;margin:32px auto 0;padding:0 20px;position:relative;z-index:2;}
.suggest-trigger{width:100%;display:flex;align-items:center;gap:10px;font-family:inherit;font-size:13px;font-weight:600;
  color:#9a93a6;background:rgba(255,255,255,.03);border:1px dashed rgba(255,255,255,.1);
  padding:13px 16px;border-radius:14px;cursor:pointer;transition:.2s;}
.suggest-trigger:hover{color:#f3eee6;border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.05);}
.st-icon{font-size:16px;}.st-text{flex:1;text-align:left;}.st-arrow{color:#e8c27a;font-size:16px;}

.suggest-overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,0);pointer-events:none;transition:background .3s;}
.suggest-overlay.open{background:rgba(0,0,0,.6);pointer-events:all;}

.suggest-panel{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(102%);z-index:50;
  width:min(480px,100vw);background:#16121e;border-radius:24px 24px 0 0;
  border:1px solid rgba(255,255,255,.1);border-bottom:none;
  padding:12px 0 44px;transition:transform .42s cubic-bezier(.32,1,.46,1);}
.suggest-panel.open{transform:translateX(-50%) translateY(0);}
.sp-handle{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:0 auto 16px;}
.sp-head{display:flex;justify-content:space-between;align-items:flex-start;padding:0 24px;margin-bottom:16px;}
.sp-kick{font-size:9px;letter-spacing:.38em;text-transform:uppercase;color:#e8c27a;font-weight:700;margin-bottom:4px;}
.sp-title{font-family:"Fraunces",serif;font-weight:700;font-size:22px;color:#f3eee6;}
.sp-close{background:none;border:none;color:#9a93a6;font-size:16px;cursor:pointer;padding:4px 8px;border-radius:8px;transition:.2s;}
.sp-close:hover{color:#f3eee6;background:rgba(255,255,255,.08);}
.sp-body{padding:0 24px;}
.sp-sub{font-size:13px;color:#9a93a6;line-height:1.55;margin-bottom:16px;}
.sp-input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#f3eee6;
  font-family:inherit;font-size:14px;border-radius:14px;padding:14px 16px;resize:none;height:100px;
  outline:none;transition:.2s;line-height:1.5;}
.sp-input:focus{border-color:rgba(167,139,250,.5);background:rgba(255,255,255,.07);}
.sp-input::placeholder{color:rgba(255,255,255,.2);}
.sp-count{font-size:11px;color:#9a93a6;text-align:right;margin:6px 0 14px;}
.sp-submit{width:100%;font-family:inherit;font-size:14px;font-weight:700;color:#0c0a10;
  background:linear-gradient(90deg,#a78bfa,#f0a6c8);border:none;border-radius:12px;
  padding:13px;cursor:pointer;transition:.2s;}
.sp-submit:hover{opacity:.9;}.sp-submit:disabled{opacity:.4;cursor:default;}
.sp-sent{display:none;text-align:center;font-size:13px;font-weight:600;color:#7ce8d6;padding:12px;margin-top:4px;}
.sp-sent.show{display:block;}
</style>

<script>
(function(){
  const panel   = document.getElementById('suggestPanel');
  const overlay = document.getElementById('suggestOverlay');

  function open()  { panel.classList.add('open');    overlay.classList.add('open');    }
  function close() { panel.classList.remove('open'); overlay.classList.remove('open'); }

  document.getElementById('suggestTrigger').addEventListener('click', open);
  document.getElementById('suggestClose').addEventListener('click', close);
  overlay.addEventListener('click', close);

  document.getElementById('suggestInput').addEventListener('input', function(){
    document.getElementById('charCount').textContent = this.value.length;
  });

  document.getElementById('suggestSubmit').addEventListener('click', async function(){
    const val = document.getElementById('suggestInput').value.trim();
    if (!val) return;
    this.disabled = true;
    this.textContent = 'Sending…';
    const sentEl = document.getElementById('suggestSent');
    try {
      const res = await fetch('/api/contact', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: 'Vaultiac User', email: '', type: 'Feature Request', message: val }) });
      sentEl.classList.add('show');
      if (res.ok) { setTimeout(close, 1800); }
      else { sentEl.textContent = '⚠ Could not send — try again.'; this.disabled = false; this.textContent = 'Send Idea'; }
    } catch(err) {
      sentEl.classList.add('show');
      sentEl.textContent = '⚠ Could not send — try again.'; this.disabled = false; this.textContent = 'Send Idea';
    }
  });

  // swipe down to close on mobile
  let ty = 0;
  panel.addEventListener('touchstart', e => { ty = e.touches[0].clientY; }, { passive: true });
  panel.addEventListener('touchend',   e => { if (e.changedTouches[0].clientY - ty > 60) close(); }, { passive: true });
})();
</script>
