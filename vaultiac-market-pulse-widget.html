<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="shortcut icon" href="/favicon.svg"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="The one stop shop for Pokemon TCG collectors. Find cards, track value, and share the flex."/>
<meta property="og:title" content="VAULTIAC - Pull it. Track it. Flex it."/>
<meta property="og:description" content="The one stop shop for Pokemon TCG collectors. Find cards, track value, and share the flex."/>
<meta property="og:url" content="https://vaultiac.com"/>
<meta property="og:type" content="website"/>
<meta property="og:image" content="https://vaultiac.com/og-image.png"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="VAULTIAC - Pull it. Track it. Flex it."/>
<meta name="twitter:description" content="The one stop shop for Pokemon TCG collectors. Find cards, track value, and share the flex."/>
<meta name="twitter:image" content="https://vaultiac.com/og-image.png"/>
<title>Market Pulse - VAULTIAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --ink:#0c0a10;--paper:#f3eee6;--muted:#9a93a6;--line:rgba(255,255,255,.10);
  --gold:#e8c27a;--holo1:#7ce8d6;--holo2:#a78bfa;--holo3:#f0a6c8;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;font-family:"Hanken Grotesk",system-ui,sans-serif;
  background:radial-gradient(1200px 700px at 50% -10%,#1b1726 0%,transparent 60%),
    radial-gradient(900px 600px at 85% 110%,#211a2c 0%,transparent 55%),var(--ink);
  color:var(--paper);display:flex;flex-direction:column;align-items:center;
  padding:54px 20px 80px;overflow-x:hidden;}

/* HOME BUTTON */
.home-btn-wrap{position:fixed;top:16px;left:16px;z-index:30;}
.home-btn{font-family:inherit;font-size:12px;font-weight:700;color:#9a93a6;background:#1a1728;border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:8px 14px;cursor:pointer;display:flex;align-items:center;gap:5px;}
.home-btn:hover{color:var(--paper);}

/* HEADER */
.lead{text-align:center;max-width:560px;margin-bottom:40px;position:relative;z-index:2;}
.lead .kick{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-weight:600;}
.lead h1{font-family:"Fraunces",serif;font-weight:900;font-size:36px;line-height:1.05;margin-top:10px;
  background:linear-gradient(120deg,#fff 0%,var(--gold) 45%,var(--holo2) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.lead .sub{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.55;}

/* TOP MOVER CARD */
.top-mover{
  width:100%;max-width:560px;border-radius:20px;padding:28px 24px;
  background:linear-gradient(155deg,#16121e 0%,#0d0b12 60%,#120d1a 100%);
  border:1px solid rgba(232,194,122,.25);
  box-shadow:0 20px 60px -20px rgba(0,0,0,.8);
  position:relative;z-index:2;margin-bottom:24px;
}
.tm-label{font-size:10px;letter-spacing:.38em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.tm-label::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);animation:pulse 1.8s ease-in-out infinite;}
.tm-name{font-family:"Fraunces",serif;font-weight:900;font-size:28px;line-height:1.05;margin-bottom:4px;}
.tm-set{font-size:12px;color:var(--muted);margin-bottom:20px;}
.tm-stats{display:flex;gap:24px;align-items:flex-end;}
.tm-price-wrap .tm-price-label{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);}
.tm-price{font-family:"Fraunces",serif;font-weight:900;font-size:42px;line-height:1;
  background:linear-gradient(90deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;}
.tm-change{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;
  padding:6px 14px;border-radius:999px;margin-top:8px;}
.tm-change.up{color:#7ce8d6;background:rgba(124,232,214,.1);border:1px solid rgba(124,232,214,.28);}
.tm-change.down{color:#f0a6c8;background:rgba(240,166,200,.1);border:1px solid rgba(240,166,200,.28);}

/* MOVERS LIST */
.section-label{width:100%;max-width:560px;position:relative;z-index:2;
  display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.section-label span{font-size:10px;letter-spacing:.38em;text-transform:uppercase;color:var(--gold);font-weight:700;white-space:nowrap;}
.section-label::after{content:"";flex:1;height:1px;background:var(--line);}

.movers-list{width:100%;max-width:560px;display:flex;flex-direction:column;gap:10px;position:relative;z-index:2;}
.mover-row{
  background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;display:flex;align-items:center;gap:14px;
}
.mover-rank{font-family:"Fraunces",serif;font-weight:700;font-size:16px;color:var(--muted);width:24px;text-align:center;flex:none;}
.mover-rank.gold{color:var(--gold);}
.mover-info{flex:1;min-width:0;}
.mover-name{font-family:"Fraunces",serif;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mover-set{font-size:11px;color:var(--muted);margin-top:2px;}
.mover-right{text-align:right;flex:none;}
.mover-price{font-family:"Fraunces",serif;font-weight:700;font-size:15px;color:var(--gold);}
.mover-pct{font-size:11px;font-weight:700;margin-top:2px;}
.mover-pct.up{color:#7ce8d6;} .mover-pct.down{color:#f0a6c8;}

.loading{text-align:center;padding:40px;color:var(--muted);font-size:13px;}

@keyframes pulse{0%,100%{opacity:.4;transform:scale(.8);}50%{opacity:1;transform:scale(1.2);}}
@keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>

<!-- HOME BUTTON -->
<div class="home-btn-wrap">
  <button class="home-btn" onclick="window.location.href='vaultiac-home.html'">← Home</button>
</div>

<!-- HEADER -->
<div class="lead">
  <div class="kick">Live Market Data</div>
  <h1>Market Pulse</h1>
  <div class="sub">Today's biggest Pokémon TCG price movers, updated daily.</div>
  <div style="font-size:11px;color:var(--muted);margin-top:6px;opacity:.7;">Tracking our watchlist of the 20 most-traded Pokémon TCG cards.</div>
</div>

<!-- TOP MOVER -->
<div class="top-mover" id="topMoverCard">
  <div class="tm-label" id="mpDate"></div>
  <div style="display:flex;align-items:center;gap:16px;margin-bottom:4px;">
    <div id="tmCardImg" style="width:60px;height:84px;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);flex:none;display:flex;align-items:center;justify-content:center;">
      <div class="ct-inner" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;"><span style="font-size:20px;opacity:.3;">&#127183;</span></div>
    </div>
    <div class="mp-info">
      <div class="mp-card-name">Loading&#8230;</div>
      <div class="mp-card-set"></div>
      <div class="mp-price-row" style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:6px;">
        <span class="mp-price"></span>
        <span class="mp-change mp-up"></span>
      </div>
    </div>
  </div>
  <div class="tm-stats" style="margin-top:10px;">
    <svg id="sparkline" viewBox="0 0 200 28" preserveAspectRatio="none" style="width:100%;height:28px;"></svg>
  </div>
</div>

<!-- MOVERS LIST -->
<div class="section-label"><span>Today's Top Movers</span></div>
<div style="font-size:10px;color:var(--muted);margin-bottom:12px;max-width:560px;width:100%;position:relative;z-index:2;">Watchlist of 20 most-traded cards · Prices from TCGPlayer via PokemonPriceTracker</div>
<div class="movers-list" id="moversList">
  <div class="loading">Loading market data…</div>
</div>

<script>
// DATE
document.getElementById('mpDate').textContent = new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}).toUpperCase();

async function loadMover(){
  try {
    const res = await fetch('/api/newsletter/top-mover');
    const json = await res.json();
    const d = json.data || json;
    if (!d || !d.card_name) return;

    document.querySelector('.mp-card-name').textContent = d.card_name;
    document.querySelector('.mp-card-set').textContent = d.set_name || '';

    const price = parseFloat(d.sale_price);
    document.querySelector('.mp-price').textContent = '$' + price.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

    const pct = parseFloat(d.price_change_pct);
    const changeEl = document.querySelector('.mp-change');
    if (!isNaN(pct) && pct !== 0) {
      const up = pct > 0;
      changeEl.textContent = (up ? '▲ +' : '▼ ') + Math.abs(pct).toFixed(2) + '% today';
      changeEl.className = 'mp-change ' + (up ? 'mp-up' : 'mp-down');
    }

    // card image
    try {
      const q = encodeURIComponent(d.card_name.split(' - ')[0]);
      const tcgRes = await fetch('https://api.pokemontcg.io/v2/cards?q=name:' + q + '&pageSize=1');
      const tcgJson = await tcgRes.json();
      if (tcgJson.data && tcgJson.data[0]) {
        const imgSrc = tcgJson.data[0].images.small;
        const img = document.createElement('img');
        img.src = imgSrc;
        img.alt = d.card_name;
        img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:4px;';
        const inner = document.querySelector('.ct-inner');
        inner.innerHTML = '';
        inner.appendChild(img);
      }
    } catch(e) {}

    // share text
    const shareText = d.card_name + ' is ' + (pct > 0 ? 'up' : 'down') + ' ' + Math.abs(pct).toFixed(2) + '% today - $' + price.toFixed(2) + '. Via @Vaultiac';
    const shareUrl = window.location.href;

    const shareNativeEl = document.getElementById('shareNative');
    if (shareNativeEl) shareNativeEl.addEventListener('click', () => {
      if (navigator.share) {
        navigator.share({ title: "Today's Mover - Vaultiac", text: shareText, url: shareUrl });
      } else {
        navigator.clipboard.writeText(shareUrl).catch(()=>{});
        shareNativeEl.textContent = 'Copied';
        setTimeout(() => { shareNativeEl.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg> Share'; }, 2000);
      }
    });

    const copyLinkEl = document.getElementById('copyLink');
    if (copyLinkEl) copyLinkEl.addEventListener('click', () => {
      navigator.clipboard.writeText(shareUrl).catch(()=>{});
      const lbl = document.getElementById('copyLinkText');
      if (lbl) { lbl.textContent = 'Copied!'; setTimeout(() => { lbl.textContent = 'Copy link'; }, 2000); }
    });

    // sparkline
    const svg = document.getElementById('sparkline');
    const prices = [price*0.94, price*0.96, price*0.95, price*0.97, price*0.98, price*0.99, price];
    const W=200, H=28, pad=3;
    const min=Math.min(...prices), max=Math.max(...prices), range=max-min||1;
    const pts = prices.map((p,i) => {
      const x = pad + (i/(prices.length-1))*(W-pad*2);
      const y = H - pad - ((p-min)/range)*(H-pad*2);
      return [x,y];
    });
    const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
    defs.innerHTML = '<linearGradient id="sparkGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7ce8d6"/><stop offset="100%" stop-color="#7ce8d6" stop-opacity="0"/></linearGradient>';
    const fillD = 'M'+pts[0][0]+','+H+' '+pts.map(([x,y])=>'L'+x+','+y).join(' ')+' L'+pts[pts.length-1][0]+','+H+' Z';
    const fillEl = document.createElementNS('http://www.w3.org/2000/svg','path');
    fillEl.setAttribute('d',fillD); fillEl.setAttribute('fill','url(#sparkGrad)'); fillEl.setAttribute('opacity','0.3');
    const lineD = 'M'+pts.map(([x,y])=>x+','+y).join(' L');
    const lineEl = document.createElementNS('http://www.w3.org/2000/svg','path');
    lineEl.setAttribute('d',lineD); lineEl.setAttribute('fill','none');
    lineEl.setAttribute('stroke','#7ce8d6'); lineEl.setAttribute('stroke-width','1.8');
    lineEl.setAttribute('stroke-linecap','round'); lineEl.setAttribute('stroke-linejoin','round');
    const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('cx',pts[pts.length-1][0]); dot.setAttribute('cy',pts[pts.length-1][1]);
    dot.setAttribute('r','3'); dot.setAttribute('fill','#7ce8d6');
    svg.appendChild(defs); svg.appendChild(fillEl); svg.appendChild(lineEl); svg.appendChild(dot);

  } catch(e) {
    document.querySelector('.mp-card-name').textContent = 'Market data unavailable';
  }
}
loadMover();

// ===== MIDNIGHT REFRESH =====
function scheduleMidnightRefresh() {
  const now = new Date();
  const nextMidnight = new Date(now);
  nextMidnight.setDate(now.getDate() + 1);
  nextMidnight.setHours(0, 0, 5, 0);
  const msUntilMidnight = nextMidnight - now;
  setTimeout(function() {
    loadMover();
    scheduleMidnightRefresh();
  }, msUntilMidnight);
}
scheduleMidnightRefresh();

async function loadTopMovers() {
  try {
    const res = await fetch('/api/newsletter/top-movers?limit=10');
    const data = await res.json();
    const cards = data.data || [];
    const list = document.getElementById('moversList');

    if (cards.length === 0) {
      list.innerHTML = '<div class="loading">No market data yet - check back soon.</div>';
      return;
    }

    list.innerHTML = cards.map((card, i) => {
      const pct = parseFloat(card.price_change_pct) || 0;
      const isUp = pct >= 0;
      return `
        <div class="mover-row">
          <div class="mover-rank ${i === 0 ? 'gold' : ''}">#${i + 1}</div>
          <div class="mover-info">
            <div class="mover-name">${card.card_name}</div>
            <div class="mover-set">${card.set_name || '-'}</div>
          </div>
          <div class="mover-right">
            <div class="mover-price">$${parseFloat(card.sale_price).toFixed(2)}</div>
            <div class="mover-pct ${isUp ? 'up' : 'down'}">${isUp ? '▲ +' : '▼ '}${pct.toFixed(1)}%</div>
          </div>
        </div>
      `;
    }).join('');
  } catch (err) {
    document.getElementById('moversList').innerHTML = '<div class="loading">Failed to load market data.</div>';
  }
}

loadTopMovers();
</script>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
