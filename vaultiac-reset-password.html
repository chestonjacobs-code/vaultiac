<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reset Password — VAULTIAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#0c0a10;--paper:#f3eee6;--muted:#9a93a6;--line:rgba(255,255,255,.10);--gold:#e8c27a;--holo1:#7ce8d6;--holo2:#a78bfa;--holo3:#f0a6c8;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;font-family:"Hanken Grotesk",system-ui,sans-serif;
  background:radial-gradient(1200px 700px at 50% -10%,#1b1726 0%,transparent 60%),
    radial-gradient(900px 600px at 85% 110%,#211a2c 0%,transparent 55%),var(--ink);
  color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 20px;min-height:100vh;}
.card{width:100%;max-width:400px;background:linear-gradient(155deg,#1a1628,#0d0b12);
  border:1px solid var(--line);border-radius:24px;padding:36px 28px;}
.brand{font-family:"Fraunces",serif;font-weight:900;font-size:16px;letter-spacing:.06em;
  background:linear-gradient(120deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;
  color:transparent;text-align:center;margin-bottom:28px;}
h1{font-family:"Fraunces",serif;font-weight:700;font-size:26px;margin-bottom:8px;}
.sub{font-size:13px;color:var(--muted);margin-bottom:24px;line-height:1.5;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px;}
.field input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--paper);
  font-family:inherit;font-size:14px;border-radius:12px;padding:13px 16px;outline:none;transition:.2s;}
.field input:focus{border-color:rgba(167,139,250,.5);background:rgba(255,255,255,.09);}
.btn{width:100%;font-family:inherit;font-size:14px;font-weight:700;color:#0c0a10;
  background:linear-gradient(90deg,var(--holo2),var(--holo3));border:none;border-radius:12px;
  padding:14px;cursor:pointer;transition:.2s;margin-top:4px;}
.btn:hover{opacity:.9;}.btn:disabled{opacity:.4;cursor:default;}
.msg{font-size:13px;text-align:center;margin-top:14px;min-height:18px;line-height:1.5;}
.msg.error{color:#f08080;}.msg.success{color:var(--holo1);}
</style>
</head>
<body>
<div class="card">
  <div class="brand">VAULTIAC</div>
  <h1 id="cardTitle">New password</h1>
  <div class="sub" id="cardSub">Enter a new password for your account.</div>
  <div id="formWrap">
    <div class="field">
      <label>New Password</label>
      <input type="password" id="pw1" placeholder="At least 6 characters"/>
    </div>
    <div class="field">
      <label>Confirm Password</label>
      <input type="password" id="pw2" placeholder="Repeat password"/>
    </div>
    <button class="btn" id="submitBtn" onclick="submitReset()">Set New Password</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script>
function getToken() {
  return new URLSearchParams(window.location.search).get('token');
}

window.addEventListener('load', function() {
  if (!getToken()) {
    document.getElementById('cardTitle').textContent = 'Invalid link';
    document.getElementById('cardSub').textContent = 'This password reset link is missing or malformed.';
    document.getElementById('formWrap').style.display = 'none';
  }
});

async function submitReset() {
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');

  msg.className = 'msg';
  msg.textContent = '';

  if (pw1.length < 6) { msg.className = 'msg error'; msg.textContent = 'Password must be at least 6 characters.'; return; }
  if (pw1 !== pw2) { msg.className = 'msg error'; msg.textContent = 'Passwords do not match.'; return; }

  btn.disabled = true;
  btn.textContent = 'Saving…';

  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: getToken(), password: pw1 })
    });
    const data = await res.json();
    if (!res.ok) {
      msg.className = 'msg error';
      msg.textContent = data.error || 'Something went wrong.';
      btn.disabled = false;
      btn.textContent = 'Set New Password';
    } else {
      document.getElementById('formWrap').style.display = 'none';
      document.getElementById('cardTitle').textContent = 'Password updated!';
      document.getElementById('cardSub').textContent = 'Your password has been changed. You can now log in.';
      msg.className = 'msg success';
      msg.textContent = 'Redirecting to home…';
      setTimeout(function() { window.location.href = 'vaultiac-home.html'; }, 2200);
    }
  } catch(e) {
    msg.className = 'msg error';
    msg.textContent = 'Network error — try again.';
    btn.disabled = false;
    btn.textContent = 'Set New Password';
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') submitReset();
});
</script>
</body>
</html>
